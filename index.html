<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Puff Flap</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1b2f;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="640"></canvas>

<script>
// ============================================================
//  PUFF FLAP - a tap-to-fly game in one file
//  Tap, click, Space or Up arrow to flap. M toggles sound.
//  Try changing the numbers below to change how the game feels!
// ============================================================

const GRAVITY    = 1500;  // how fast Puff falls
const FLAP_POWER = -430;  // how strong each flap is (negative = up)
const MAX_FALL   = 700;   // fastest falling speed
const PIPE_WIDTH = 70;    // width of the pillars
const SPACING    = 230;   // distance between pillars
const START_GAP  = 185;   // gap size at the start
const MIN_GAP    = 135;   // smallest gap (hardest)
const START_SPEED = 160;  // starting scroll speed
const MAX_SPEED   = 260;  // top scroll speed

// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND_H = 80;
const GROUND_Y = H - GROUND_H;

// Scale the canvas to fit any screen (phone or desktop)
function fitToScreen() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
}
window.addEventListener('resize', fitToScreen);
fitToScreen();

// ---------- Sound (made in code, no audio files needed) ----------
let audio = null;
let muted = false;

function initAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audio = null; }
  }
  if (audio && audio.state === 'suspended') audio.resume();
}

function tone(freq, duration, type, volume, slide) {
  if (!audio || muted) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + duration);
  gain.gain.setValueAtTime(volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start(t);
  osc.stop(t + duration);
}

const sounds = {
  flap:  () => tone(420, 0.12, 'square', 0.04, 300),
  point: () => { tone(880, 0.08, 'sine', 0.08); setTimeout(() => tone(1320, 0.12, 'sine', 0.08), 80); },
  hit:   () => tone(220, 0.45, 'sawtooth', 0.09, -170)
};

// ---------- High score (saved in the browser) ----------
let best = 0;
try { best = Number(localStorage.getItem('puffflap-best')) || 0; } catch (e) {}
function saveBest() {
  try { localStorage.setItem('puffflap-best', String(best)); } catch (e) {}
}

// ---------- Game state ----------
const player = { x: 110, y: H / 2, vy: 0, r: 16, rot: 0, wing: 0 };
let pipes = [];
let particles = [];
let clouds = [];
let state = 'ready';     // 'ready' | 'playing' | 'over'
let score = 0;
let speed = START_SPEED;
let distSinceSpawn = 0;
let groundX = 0;
let hillX = 0;
let shake = 0;
let flash = 0;
let time = 0;
let overTime = 0;
let newBest = false;

for (let i = 0; i < 5; i++) {
  clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 220, s: 0.6 + Math.random() * 0.8 });
}

function reset() {
  player.y = H / 2;
  player.vy = 0;
  player.rot = 0;
  pipes = [];
  particles = [];
  score = 0;
  speed = START_SPEED;
  distSinceSpawn = SPACING; // first column appears right away
  newBest = false;
  state = 'ready';
}

// ---------- Input ----------
function flap() {
  initAudio();
  if (state === 'over') {
    if (time - overTime < 0.6) return; // short pause so you don't restart by accident
    reset();
  }
  if (state === 'ready') state = 'playing';
  player.vy = FLAP_POWER;
  sounds.flap();
  puffEffect();
}

window.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (!e.repeat) flap();
  }
  if (e.code === 'KeyM') muted = !muted;
});

// ---------- Columns ----------
function currentGap() {
  return Math.max(MIN_GAP, START_GAP - score * 2);
}

function spawnPipe() {
  const gap = currentGap();
  const minTop = 70;
  const maxTop = GROUND_Y - 70 - gap;
  let top = minTop + Math.random() * (maxTop - minTop);
  // keep gaps reachable: no huge jumps between neighbouring columns
  const prev = pipes[pipes.length - 1];
  if (prev) top = Math.max(prev.top - 170, Math.min(prev.top + 170, top));
  top = Math.max(minTop, Math.min(maxTop, top));
  pipes.push({ x: W + 10, top, gap, passed: false });
}

function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function hitsPipe(p) {
  const r = player.r - 3; // a little forgiving
  const tip = 8; // the rounded pillar tips stick out a little
  return circleHitsRect(player.x, player.y, r, p.x, 0, PIPE_WIDTH, p.top + tip) ||
         circleHitsRect(player.x, player.y, r, p.x, p.top + p.gap - tip, PIPE_WIDTH, GROUND_Y - (p.top + p.gap) + tip);
}

function gameOver() {
  if (state !== 'playing') return;
  state = 'over';
  overTime = time;
  shake = 12;
  flash = 0.8;
  sounds.hit();
  burst(player.x, player.y, 22, ['#fbbf24', '#f59e0b', '#ffffff']);
  if (score > best) {
    best = score;
    newBest = true;
    saveBest();
  }
}

// ---------- Particles ----------
function puffEffect() {
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: player.x - 12, y: player.y + 6,
      vx: -60 - Math.random() * 60, vy: 20 + Math.random() * 60,
      life: 0.4, max: 0.4, size: 3 + Math.random() * 3, color: '#ffffff'
    });
  }
}

function burst(x, y, count, colors) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 80 + Math.random() * 220;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.7, max: 0.7, size: 2 + Math.random() * 4,
      color: colors[i % colors.length]
    });
  }
}

// ---------- Update ----------
function update(dt) {
  time += dt;

  for (const c of clouds) {
    c.x -= speed * 0.15 * c.s * dt;
    if (c.x < -90) { c.x = W + 90; c.y = 40 + Math.random() * 220; }
  }
  if (state !== 'over') {
    groundX = (groundX - speed * dt) % 24;
    hillX = (hillX - speed * 0.3 * dt) % 200;
  }

  if (state === 'ready') {
    player.y = H / 2 + Math.sin(time * 3) * 8;
    player.wing += dt * 10;
  } else if (state === 'playing') {
    player.vy = Math.min(MAX_FALL, player.vy + GRAVITY * dt);
    player.y += player.vy * dt;
    player.rot = Math.max(-0.5, Math.min(1.3, player.vy / 600));
    player.wing += dt * (player.vy < 0 ? 25 : 8);

    if (player.y - player.r < 0) { player.y = player.r; player.vy = 0; }

    speed = Math.min(MAX_SPEED, START_SPEED + score * 4);
    distSinceSpawn += speed * dt;
    if (distSinceSpawn >= SPACING) { distSinceSpawn = 0; spawnPipe(); }

    for (const p of pipes) {
      p.x -= speed * dt;
      if (!p.passed && p.x + PIPE_WIDTH < player.x) {
        p.passed = true;
        score++;
        sounds.point();
      }
      if (hitsPipe(p)) gameOver();
    }
    pipes = pipes.filter(p => p.x > -PIPE_WIDTH - 20);

    if (player.y + player.r >= GROUND_Y) {
      player.y = GROUND_Y - player.r;
      gameOver();
    }
  } else if (state === 'over') {
    if (player.y + player.r < GROUND_Y) {
      player.vy = Math.min(MAX_FALL, player.vy + GRAVITY * dt);
      player.y += player.vy * dt;
      player.rot = Math.min(1.5, player.rot + dt * 5);
    }
    if (player.y + player.r > GROUND_Y) player.y = GROUND_Y - player.r;
  }

  for (const pt of particles) {
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 400 * dt;
    pt.life -= dt;
  }
  particles = particles.filter(pt => pt.life > 0);

  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 3);
}

// ---------- Drawing ----------
function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#38bdf8');
  sky.addColorStop(1, '#bae6fd');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // sun
  ctx.fillStyle = 'rgba(254, 240, 138, 0.9)';
  ctx.beginPath();
  ctx.arc(320, 90, 36, 0, Math.PI * 2);
  ctx.fill();

  // clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  for (const c of clouds) {
    const s = c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18 * s, 0, Math.PI * 2);
    ctx.arc(c.x + 20 * s, c.y - 8 * s, 22 * s, 0, Math.PI * 2);
    ctx.arc(c.x + 42 * s, c.y, 17 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // hills
  ctx.fillStyle = '#86efac';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = hillX - 200; x < W + 200; x += 200) {
    ctx.quadraticCurveTo(x + 50, GROUND_Y - 90, x + 100, GROUND_Y - 30);
    ctx.quadraticCurveTo(x + 150, GROUND_Y + 20, x + 200, GROUND_Y - 40);
  }
  ctx.lineTo(W, GROUND_Y);
  ctx.closePath();
  ctx.fill();
}

// Candy-striped pillars with a rounded crystal tip
function drawPillar(x, y, h, tipAtBottom) {
  const grad = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
  grad.addColorStop(0, '#7c3aed');
  grad.addColorStop(0.45, '#c4b5fd');
  grad.addColorStop(1, '#6d28d9');

  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, PIPE_WIDTH, h);
  ctx.clip();
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, PIPE_WIDTH, h);
  // diagonal stripes
  ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
  for (let sy = y - PIPE_WIDTH; sy < y + h; sy += 34) {
    ctx.beginPath();
    ctx.moveTo(x, sy);
    ctx.lineTo(x + PIPE_WIDTH, sy + 22);
    ctx.lineTo(x + PIPE_WIDTH, sy + 36);
    ctx.lineTo(x, sy + 14);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = '#3b0764';
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, PIPE_WIDTH, h);

  // rounded tip with a glowing gem
  const tipY = tipAtBottom ? y + h : y;
  ctx.fillStyle = '#f0abfc';
  ctx.beginPath();
  ctx.ellipse(x + PIPE_WIDTH / 2, tipY, PIPE_WIDTH / 2 + 4, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.arc(x + PIPE_WIDTH / 2, tipY, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipe(p) {
  const bottomY = p.top + p.gap;
  drawPillar(p.x, -5, p.top + 5, true);            // top pillar
  drawPillar(p.x, bottomY, GROUND_Y - bottomY, false); // bottom pillar
}

function drawGround() {
  ctx.fillStyle = '#d6a35c';
  ctx.fillRect(0, GROUND_Y, W, GROUND_H);
  ctx.fillStyle = '#65a30d';
  ctx.fillRect(0, GROUND_Y, W, 14);
  ctx.fillStyle = '#4d7c0f';
  for (let x = groundX; x < W; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y + 14);
    ctx.lineTo(x + 12, GROUND_Y + 14);
    ctx.lineTo(x + 6, GROUND_Y + 22);
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = '#3f6212';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
}

function drawPlayer() {
  const r = player.r;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.rot);

  // body
  ctx.fillStyle = '#fbbf24';
  ctx.strokeStyle = '#92400e';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // belly
  ctx.fillStyle = '#fef3c7';
  ctx.beginPath();
  ctx.ellipse(-2, 7, 9, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // wing
  const wingLift = Math.sin(player.wing) * 6;
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.ellipse(-7, 1 + wingLift * 0.5, 9, 5 + Math.abs(wingLift) * 0.4, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // eye
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(6, -5, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1f2937';
  ctx.beginPath();
  ctx.arc(8, -5, 3, 0, Math.PI * 2);
  ctx.fill();

  // cheek
  ctx.fillStyle = 'rgba(244, 114, 182, 0.6)';
  ctx.beginPath();
  ctx.arc(4, 5, 3, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#fb923c';
  ctx.strokeStyle = '#9a3412';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(r - 3, -3);
  ctx.lineTo(r + 9, 1);
  ctx.lineTo(r - 3, 5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function bigText(text, x, y, size, color) {
  ctx.font = `800 ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(4, size / 6);
  ctx.strokeStyle = '#1e293b';
  ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color || '#ffffff';
  ctx.fillText(text, x, y);
}

function drawUI() {
  if (state === 'playing') {
    bigText(String(score), W / 2, 70, 56);
  }

  if (state === 'ready') {
    bigText('PUFF FLAP', W / 2, 150, 54, '#fde047');
    bigText('Tap, click or press Space', W / 2, 410, 20);
    bigText('to fly through the gaps', W / 2, 438, 20);
    if (best > 0) bigText('Best: ' + best, W / 2, 490, 22, '#fde047');
    bigText(muted ? 'Sound: off (M)' : 'Sound: on (M)', W / 2, H - 40, 15);
  }

  if (state === 'over') {
    bigText('GAME OVER', W / 2, 150, 50, '#f87171');

    // score panel
    ctx.fillStyle = 'rgba(255, 251, 235, 0.95)';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 4;
    const px = W / 2 - 120, py = 210, pw = 240, ph = 150;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 16);
    else ctx.rect(px, py, pw, ph);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#78350f';
    ctx.font = '700 18px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SCORE', W / 2 - 55, py + 35);
    ctx.fillText('BEST', W / 2 + 55, py + 35);
    bigText(String(score), W / 2 - 55, py + 80, 44);
    bigText(String(best), W / 2 + 55, py + 80, 44, '#fde047');
    if (newBest) bigText('NEW BEST!', W / 2, py + 127, 22, '#4ade80');

    if (time - overTime > 0.6 && Math.floor(time * 2) % 2 === 0) {
      bigText('Tap to try again', W / 2, 420, 24);
    }
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawParticles();
  drawPlayer();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flash})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawUI();
}

// ---------- Game loop ----------
const STEP = 1 / 120; // physics runs at a steady 120 steps per second
let last = performance.now();
let acc = 0;

function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1; // avoid big jumps after switching tabs
  acc += dt;
  while (acc >= STEP) {
    update(STEP);
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => { last = performance.now(); });

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
